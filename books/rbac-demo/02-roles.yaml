---
# Role que permite listar y obtener pods en el namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: default
  labels:
    app: rbac-demo
    purpose: demonstration
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
# Role más amplio que incluye logs y exec (para ejemplos avanzados)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-admin
  namespace: default
  labels:
    app: rbac-demo
    purpose: demonstration
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "create", "delete", "update", "patch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]

---
# ClusterRole para mostrar diferencias entre Role y ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-pod-reader
  labels:
    app: rbac-demo
    purpose: demonstration
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]