---
# ServiceAccount para el ejemplo de RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader-sa
  namespace: default
  labels:
    app: rbac-demo
    purpose: demonstration

---
# ServiceAccount sin permisos para comparar
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restricted-sa
  namespace: default
  labels:
    app: rbac-demo
    purpose: demonstration
    permissions: none
