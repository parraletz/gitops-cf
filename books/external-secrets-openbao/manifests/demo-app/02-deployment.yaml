---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: secrets-demo
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: application
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/component: application
      annotations:
        # Forzar recreación del pod cuando cambien los secrets
        secrets.external-secrets.io/reload: "true"
    spec:
      serviceAccountName: demo-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: demo-app
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args: ["/config/entrypoint.sh"]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: APP_ENV
          value: "demo"
        - name: APP_VERSION
          value: "1.0.0"
        # Variables de entorno desde secrets externos
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: app-database-secret
              key: database-url
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-database-secret
              key: database-username
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-config-secret
              key: api_key
              optional: true
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: database-secrets
          mountPath: /secrets/database
          readOnly: true
        - name: config-secrets
          mountPath: /secrets/config
          readOnly: true
        - name: tls-secrets
          mountPath: /secrets/tls
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: demo-app-config
          defaultMode: 0755
      - name: database-secrets
        secret:
          secretName: app-database-secret
          optional: true
      - name: config-secrets
        secret:
          secretName: app-connection-secret
          optional: true
      - name: tls-secrets
        secret:
          secretName: app-tls-secret
          optional: true
      restartPolicy: Always