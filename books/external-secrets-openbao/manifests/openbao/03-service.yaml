---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: openbao-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 8200
    targetPort: http
    protocol: TCP
  - name: internal
    port: 8201
    targetPort: internal
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-ui
  namespace: openbao-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 8200
    targetPort: http
    protocol: TCP
    nodePort: 30820