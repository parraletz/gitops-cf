---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-secret-store
  namespace: secrets-demo
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-store
spec:
  provider:
    vault:
      server: "http://openbao.openbao-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Método de autenticación por token (simplificado para demo)
        tokenSecretRef:
          name: "openbao-token"
          key: "token"
          namespace: "secrets-demo"
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao-cluster-secret-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: cluster-secret-store
spec:
  provider:
    vault:
      server: "http://openbao.openbao-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Método de autenticación por token
        tokenSecretRef:
          name: "openbao-token"
          key: "token"
          namespace: "external-secrets-system"