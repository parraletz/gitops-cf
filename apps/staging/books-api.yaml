apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: books-api-staging-oci
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/parraletz/charts/books-api
      targetRevision: "6.0.2"
      chart: books-api
      path: .
      helm:
        releaseName: books-api
        valuesObject:
          # replicaCount solo se usa si httpScaledObject/scaleObject están deshabilitados
          replicaCount: 1
          ingressGateway:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: books-api.staging.cloudnative.lat
            enabled: true
            hosts:
              - host: books-api.staging.cloudnative.lat
          # Traditional CPU/Memory based scaling - DISABLED
          scaleObject:
            enabled: false
            minReplicaCount: 1
            maxReplicaCount: 10
            targetCPUUtilizationPercentage: 70
            targetMemoryUtilizationPercentage: 80
          # KEDA HTTP Add-on - HTTP traffic based autoscaling
          httpScaledObject:
            enabled: true
            # Hosts that this HTTPScaledObject will handle
            hosts:
              - books-api.staging.cloudnative.lat
            # Target service configuration
            scaleTargetRef:
              name: "" # Uses chart fullname by default
              service: "" # Uses chart fullname by default
              port: 80 # Must match service.port
            # Replica configuration
            replicas:
              min: 0 # Scale-to-zero when no traffic (saves resources)
              max: 10 # Maximum replicas under load
            # Scaling metric configuration
            scalingMetric:
              requestRate:
                targetValue: 100
                window: "1m"
                granularity: "1s"
            # Pending requests threshold before scaling up
            targetPendingRequests: 100
            # Cooldown period before scaling down (seconds)
            cooldownPeriod: 300 # Wait 5 minutes without traffic
            # KEDA HTTP Add-on interceptor configuration
            interceptor:
              namespace: "keda"
              service: "keda-add-ons-http-interceptor-proxy"
              port: 8080
              targetHost: "" # Empty uses internal FQDN
              preserveHostHeader: true # Preserve external domain in Host header
          image:
            tag: "6.0.2"
            repository: ghcr.io/parraletz/books-api
            # valuesFiles:
            #   - $values/books/api/values-staging.yaml
    - repoURL: git@github.com:parraletz/gitops-cf.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: books-api-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
